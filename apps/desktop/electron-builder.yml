# Masaüstü paketleme (§22.2, §22.5)
appId: com.marketotomasyon.kasa
# Electron sürümü AÇIKÇA yazılır. Çalışma alanında (npm workspaces) electron
# kökteki node_modules'a kurulur; electron-builder onu apps/desktop altında
# bulamayınca "Cannot compute electron version" hatasıyla duruyor ve Windows
# kurulum paketi hiç üretilmiyordu. Electron yükseltilince burası da güncellenir
# (test/electron-surumu.test.ts farkı yakalar).
electronVersion: 33.4.11
productName: Market Otomasyon
copyright: © 2026 Market Otomasyon

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.git,.github,test,__tests__,docs}/**'

# better-sqlite3 ve serialport yerel modüldür; paketin içine açık halde konur (asar dışı).
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  # Terazi seri portu (yerel modül).
  - '**/node_modules/@serialport/**'

# Yerel modüller electron-builder tarafından YENİDEN DERLENMEZ:
#  - better-sqlite3'ün Electron ikilisi `predist` → scripts/native-hazirla.mjs
#    ile hazır indirilir (better_sqlite3-abi<N>.node); sürücü ABI'ye göre seçer.
#  - serialport (@serialport/bindings-cpp) N-API'dir ve win32-x64 hazır ikilisiyle
#    gelir; Electron'da yeniden derleme gerektirmez.
# Yeniden derleme açıkken Windows CI'da kaynaktan derleme deneniyor ve kırılıyordu.
npmRebuild: false
buildDependenciesFromSource: false

win:
  target:
    - target: nsis
      arch: [x64]
  # Kod imzalama (§22.2): sertifika CI ortam değişkenlerinden gelir.
  # CSC_LINK ve CSC_KEY_PASSWORD tanımlıysa electron-builder otomatik imzalar.
  artifactName: MarketOtomasyon-Kurulum-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Market Otomasyon
  language: '1055' # Türkçe
  # Kaldırma sırasında kullanıcı verisi (veritabanı, yedekler) SİLİNMEZ.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  category: Office
  artifactName: MarketOtomasyon-${version}.${ext}

# Otomatik güncelleme (§22.5). Yayın kanalı sürüm etiketinden belirlenir;
# kademeli yayın için `stagingPercentage` kullanılabilir.
publish:
  provider: generic
  url: https://guncelleme.marketotomasyon.local/kasa
  channel: latest
